:root{
  --red-500:#ed1c25;--red-600:#d7141d;--red-700:#b80f17;--red-50:#fdeeee;
  --ink-900:#0a0a0a;--ink-600:#4a4a4a;--ink-400:#6b6b6b;--line-200:#e6e6e6;--line-100:#f1f1f1;
  --cream-100:#faf3ef;--surface-0:#ffffff;--surface-1:#f6f6f6;--on-red:#ffffff;
  --ok:#1f7a4d;--ok-50:#e8f5ee;--warn:#8f5b00;--warn-50:#fff4dc;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--space-16:64px;--space-20:80px;
  --radius-sm:4px;--radius-md:8px;--radius-lg:12px;--radius-pill:999px;
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --shadow-raised:0 2px 4px rgba(0,0,0,.06),0 16px 40px rgba(0,0,0,.10);
  --font-display:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --surface-0:#121212;--surface-1:#1b1b1b;--cream-100:#1b1b1b;--ink-900:#f4f4f4;--ink-600:#c6c6c6;--ink-400:#9c9c9c;
    --line-200:#343434;--line-100:#262626;--red-600:#ff6a70;--red-50:#2c1618;--ok:#5fd09a;--ok-50:#14281e;--warn:#f0b950;--warn-50:#2b2312;
    --shadow-card:0 1px 2px rgba(0,0,0,.4);--shadow-raised:0 8px 30px rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --surface-0:#121212;--surface-1:#1b1b1b;--cream-100:#1b1b1b;--ink-900:#f4f4f4;--ink-600:#c6c6c6;--ink-400:#9c9c9c;
  --line-200:#343434;--line-100:#262626;--red-600:#ff6a70;--red-50:#2c1618;--ok:#5fd09a;--ok-50:#14281e;--warn:#f0b950;--warn-50:#2b2312;
  --shadow-card:0 1px 2px rgba(0,0,0,.4);--shadow-raised:0 8px 30px rgba(0,0,0,.6);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--surface-0);color:var(--ink-900);font-family:var(--font-sans);font-size:16px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);margin:0;letter-spacing:-.03em;line-height:1.1;font-weight:800}
.accent{color:var(--red-500)}
.eyebrow{font:600 12px/1.4 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--red-600);margin:0 0 12px}
h1{font-size:clamp(34px,6vw,54px);letter-spacing:-.035em;line-height:1.03}
h2{font-size:clamp(26px,4vw,34px)}
h3{font-size:22px;letter-spacing:-.02em;line-height:1.25}
h4{font-size:16px;letter-spacing:-.01em;line-height:1.3;font-weight:700}
p{margin:0 0 var(--space-3);color:var(--ink-600)}
a{color:var(--red-600);font-weight:600}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--red-500);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.wrap{max-width:900px;margin:0 auto;padding:0 var(--space-4)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{border-bottom:1px solid var(--line-200);background:var(--surface-0);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);min-height:80px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{all:unset;cursor:pointer;display:block;min-height:44px;display:flex;flex-direction:column;justify-content:center;border-radius:8px}
.brand:focus-visible{outline:3px solid var(--red-500);outline-offset:3px}
.brand b{font:800 18px/1.1 var(--font-display);letter-spacing:-.02em;color:var(--ink-900)}
.brand small{font-size:12px;color:var(--ink-400);line-height:1.3}
.topnav{display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap}
.topnav button,.topnav a{all:unset;cursor:pointer;display:inline-flex;align-items:center;min-height:44px;padding:0 12px;font:600 14px/1 var(--font-sans);color:var(--ink-600);border-radius:var(--radius-pill);text-decoration:none}
.topnav button:hover,.topnav a:hover{color:var(--ink-900);background:var(--surface-1)}
.topnav button.on{color:var(--ink-900);background:var(--surface-1)}
.topnav button:focus-visible,.topnav a:focus-visible{outline:3px solid var(--red-500);outline-offset:2px}

main{padding:var(--space-10) 0 var(--space-16)}
.view{display:none}.view.on{display:block}

/* buttons */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 26px;border-radius:var(--radius-sm);font:700 17px/1 var(--font-display);letter-spacing:-.02em;background:var(--red-500);color:var(--on-red);border:1.5px solid var(--red-500);transition:background .15s,color .15s,border-color .15s,transform .1s;text-align:center}
.btn:hover{background:var(--red-700);border-color:var(--red-700)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--red-500);outline-offset:3px}
.btn.sec{background:var(--surface-0);color:var(--red-600);border-color:var(--red-500)}
.btn.sec:hover{background:var(--red-50);border-color:var(--red-500)}
.btn.sm{min-height:44px;padding:0 18px;font-size:15px}
.btn[disabled],.btn.busy{opacity:.7;cursor:progress}
.btn .spin{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.btn.sec .spin{border-color:var(--line-200);border-top-color:var(--red-500)}
.btn.busy .spin{display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.linkbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;min-height:44px;font:700 15px/1 var(--font-display);color:var(--ink-600);padding:0 4px;border-radius:6px}
.linkbtn:hover{color:var(--ink-900)}
.linkbtn.red{color:var(--red-600)}
.linkbtn:focus-visible{outline:3px solid var(--red-500);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}

/* cards */
.card{background:var(--surface-0);border:1px solid var(--line-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:var(--space-8)}
.card.tight{padding:var(--space-5)}
.card.flat{background:var(--cream-100);border-color:transparent;box-shadow:none}
.item{border:1px solid var(--line-200);border-radius:var(--radius-lg);padding:var(--space-5);background:var(--surface-0)}
.item+.item{margin-top:var(--space-4)}
.item-h{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4)}
.item-h .jd-input{font-weight:700}

/* hero */
.hero{max-width:720px;margin:0 0 var(--space-8)}
.hero p{font-size:18px;line-height:1.6;margin-top:var(--space-4)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--space-5)}
.pill{display:inline-flex;align-items:center;padding:7px 12px;border-radius:var(--radius-pill);background:var(--line-100);color:var(--ink-600);font:700 11px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase}
.pill.red{background:var(--red-50);color:var(--red-600)}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5)}
.path{display:flex;flex-direction:column;gap:var(--space-3)}
.path p{flex:1;margin:0 0 var(--space-3)}
.icon{width:44px;height:44px;border-radius:var(--radius-pill);background:var(--red-50);display:grid;place-items:center}
.icon svg{width:22px;height:22px;stroke:var(--red-500);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.teaser{margin-top:var(--space-8);display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);flex-wrap:wrap;padding:var(--space-5) var(--space-6);border-radius:var(--radius-lg);background:var(--cream-100)}
.teaser p{margin:0;color:var(--ink-900);font-weight:600}

/* wizard */
.wiz-top{margin-bottom:var(--space-6)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:thin}
.steps button{all:unset;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 6px;border-radius:var(--radius-pill);font:600 13px/1 var(--font-sans);color:var(--ink-400);border:1.5px solid transparent}
.steps button .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-200);font:700 13px/1 var(--font-display);color:var(--ink-400);background:var(--surface-0)}
.steps button.done .n{background:var(--red-500);border-color:var(--red-500);color:#fff}
.steps button.now{color:var(--ink-900);border-color:var(--line-200)}
.steps button.now .n{border-color:var(--red-500);color:var(--red-500)}
.steps button.done{color:var(--ink-600)}
.steps button:focus-visible{outline:3px solid var(--red-500);outline-offset:2px}
.bar{height:4px;background:var(--line-200);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red-500);transition:width .25s}
.panel h2{margin-bottom:var(--space-3)}
.panel .intro{font-size:16px;margin:0 0 var(--space-6);max-width:62ch}
.nav{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin-top:var(--space-8);padding-top:var(--space-6);border-top:1px solid var(--line-200);flex-wrap:wrap}
.saved{font-size:13px;color:var(--ink-400);margin-top:var(--space-3)}

/* fields */
.stack{display:grid;gap:var(--space-6)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5) var(--space-4)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-5) var(--space-4)}
.grid2 .full,.grid3 .full{grid-column:1/-1}
.fld{border:0;margin:0;padding:0;min-width:0}
.lbl{display:block;font:700 14px/1.3 var(--font-sans);color:var(--ink-900);margin:0 0 6px;padding:0}
.hint{font-size:13px;color:var(--ink-400);line-height:1.45;margin:-2px 0 8px}
.jd-input{appearance:none;width:100%;min-height:48px;padding:0 14px;border:1.5px solid var(--line-200);border-radius:var(--radius-md);background:var(--surface-0);color:var(--ink-900);font:600 16px/1.2 var(--font-sans);transition:border-color .15s,box-shadow .15s}
.jd-input:hover{border-color:#cfcfcf}
.jd-input:focus{border-color:var(--red-500);outline:none;box-shadow:0 0 0 3px var(--red-50)}
select.jd-input{background-image:linear-gradient(45deg,transparent 50%,var(--ink-400) 50%),linear-gradient(135deg,var(--ink-400) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea.jd-input{min-height:88px;padding:12px 14px;line-height:1.5;font-weight:400;resize:vertical}
.jd-input.bad{border-color:var(--red-500)}
.err{color:var(--red-600);font-size:13px;font-weight:600;margin-top:6px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative;display:inline-flex}
.seg input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.seg span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1.5px solid var(--line-200);border-radius:var(--radius-pill);font:600 14px/1.1 var(--font-sans);color:var(--ink-900);cursor:pointer;user-select:none;transition:border-color .12s,background .12s,color .12s}
.seg span:hover{border-color:var(--ink-400)}
.seg input:checked+span{border-color:var(--red-500);background:var(--red-50);color:var(--red-600)}
.seg input:focus-visible+span{outline:3px solid var(--red-500);outline-offset:2px}
.seg.chips span{border-radius:var(--radius-md);font-weight:500}
.seg.chips input:checked+span{font-weight:700}
.tiles{display:grid;gap:10px}
.tile{border:1.5px solid var(--line-200);border-radius:var(--radius-md);padding:14px 16px;transition:border-color .12s,background .12s}
.tile.on{border-color:var(--red-500);background:var(--red-50)}
.tile>label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;min-height:44px}
.tile input[type=checkbox]{width:22px;height:22px;margin:1px 0 0;accent-color:var(--red-500);flex:none}
.tile b{display:block;color:var(--ink-900);font-size:15px;line-height:1.35}
.tile small{display:block;color:var(--ink-600);font-size:13px;line-height:1.45;margin-top:2px}
.tile .more{display:none;margin:12px 0 0 34px;gap:12px}
.tile.on .more{display:grid}
.tag{display:inline-block;font:600 11px/1 var(--font-sans);color:var(--ink-400);border:1px solid var(--line-200);border-radius:var(--radius-pill);padding:4px 8px;margin-left:6px;vertical-align:1px}
.callout{border-radius:var(--radius-lg);padding:var(--space-4) var(--space-5);background:var(--cream-100);margin:0 0 var(--space-6)}
.callout h4{margin-bottom:6px}
.callout p,.callout li{font-size:14px;color:var(--ink-600)}
.callout ul{margin:6px 0 0;padding-left:20px}
.callout.warn{background:var(--warn-50)}
.callout.ok{background:var(--ok-50)}
.sub{font:800 18px/1.2 var(--font-display);letter-spacing:-.02em;margin:var(--space-8) 0 var(--space-4);color:var(--ink-900)}
.sub:first-child{margin-top:0}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);margin-top:var(--space-4)}
.tot{border:1px solid var(--line-200);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4)}
.tot b{display:block;font:800 22px/1.1 var(--font-display);color:var(--ink-900)}
.tot span{font-size:12px;color:var(--ink-400)}

/* review */
.rev{display:grid;gap:var(--space-3)}
.revrow{display:flex;justify-content:space-between;gap:var(--space-4);padding:var(--space-3) 0;border-bottom:1px solid var(--line-200);font-size:15px}
.revrow span:first-child{color:var(--ink-600)}
.revrow span:last-child{color:var(--ink-900);font-weight:600;text-align:right}
.gap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-200);font-size:15px;color:var(--ink-900)}
.checklist{display:grid;gap:8px}
.checklist label{display:flex;gap:12px;align-items:flex-start;min-height:44px;padding:8px 0;cursor:pointer;font-size:15px;color:var(--ink-900)}
.checklist input{width:22px;height:22px;accent-color:var(--red-500);flex:none;margin:0}
.fin{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);flex-wrap:wrap;padding:var(--space-5) var(--space-6);border:1.5px solid var(--line-200);border-radius:var(--radius-lg);margin-top:var(--space-8)}
.fin h4{margin-bottom:4px}
.fin p{margin:0;font-size:14px}

/* buyer */
.homes{display:grid;gap:var(--space-3)}
.home{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);flex-wrap:wrap;border:1px solid var(--line-200);border-radius:var(--radius-md);padding:var(--space-4) var(--space-5)}
.home b{font:700 17px/1.3 var(--font-display);display:block}
.home small{color:var(--ink-400);font-size:13px}
.sect{border:1px solid var(--line-200);border-radius:var(--radius-md);background:var(--surface-0);margin-bottom:var(--space-3)}
.sect[open]{border-color:var(--red-500)}
.sect[open] summary{color:var(--red-600)}
.sect summary::after{content:"+";flex:none;width:30px;height:30px;border-radius:var(--radius-pill);background:var(--line-100);color:var(--ink-900);display:grid;place-items:center;font:500 20px/1 var(--font-sans);margin-left:auto}
.sect[open] summary::after{content:"\2212";background:var(--red-500);color:#fff}
.sect summary .ct{margin-left:auto;margin-right:12px}
.sect summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:0 var(--space-5);font:700 17px/1.2 var(--font-display);color:var(--ink-900);border-radius:var(--radius-md)}
.sect summary::-webkit-details-marker{display:none}
.sect summary .ct{font:600 13px/1 var(--font-sans);color:var(--ink-400)}
.sect[open] summary{border-bottom:1px solid var(--line-200);border-radius:var(--radius-md) var(--radius-md) 0 0}
.chk{padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--line-200)}
.chk:last-child{border-bottom:0}
.chk .q{font:700 15px/1.35 var(--font-sans);color:var(--ink-900)}
.chk .h{font-size:13px;color:var(--ink-400);line-height:1.45;margin:2px 0 10px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tri button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:44px;border:1.5px solid var(--line-200);border-radius:var(--radius-pill);font:700 14px/1 var(--font-sans);color:var(--ink-900);text-align:center;transition:background .1s,border-color .1s}
.tri button:hover{border-color:var(--ink-400)}
.tri button:active{transform:translateY(1px)}
.tri button:focus-visible{outline:3px solid var(--red-500);outline-offset:2px}
.tri button[aria-pressed="true"].g{background:var(--ok-50);border-color:var(--ok);color:var(--ok)}
.tri button[aria-pressed="true"].w{background:var(--warn-50);border-color:var(--warn);color:var(--warn)}
.tri button[aria-pressed="true"].p{background:var(--red-50);border-color:var(--red-500);color:var(--red-600)}
.chk .note{display:none;margin-top:10px}
.chk.open .note{display:block}
.facts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-4)}
.sumcount{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3);margin:var(--space-5) 0}
.sumcount .tot b.p{color:var(--red-600)}.sumcount .tot b.w{color:var(--warn)}.sumcount .tot b.g{color:var(--ok)}
.list{margin:0 0 var(--space-5);padding:0;list-style:none;display:grid;gap:10px}
.list li{padding:12px 14px;border:1px solid var(--line-200);border-radius:var(--radius-md);font-size:15px;color:var(--ink-900)}
.list li small{display:block;color:var(--ink-600);font-size:13px;margin-top:3px}
.scroll{overflow-x:auto;border:1px solid var(--line-200);border-radius:var(--radius-md)}
table.cmp{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.cmp th,table.cmp td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line-200);vertical-align:top;color:var(--ink-900)}
table.cmp th{font:700 13px/1.3 var(--font-sans);color:var(--ink-600);background:var(--surface-1);white-space:nowrap}
table.cmp tr:last-child td{border-bottom:0}

/* changes */
.chg{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.chg .card{padding:var(--space-6)}
.chg h3{margin-bottom:var(--space-2)}
.chg .means{margin:var(--space-3) 0 0;padding-top:var(--space-3);border-top:1px solid var(--line-200);font-size:14px;color:var(--ink-900)}
.chg .means b{font-weight:700}
.same{margin-top:var(--space-6)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink-900);color:var(--surface-0);padding:12px 18px;border-radius:var(--radius-pill);font:600 14px/1.2 var(--font-sans);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

footer.foot{border-top:1px solid var(--line-200);padding:var(--space-8) 0 var(--space-10);margin-top:var(--space-8)}
footer.foot p{font-size:12.5px;color:var(--ink-400);line-height:1.55;max-width:80ch}
.hide{display:none!important}
h1:focus,h2:focus{outline:none}

@media (max-width:640px){
  main{padding-top:var(--space-6)}
  .paths,.grid2,.chg,.facts-grid{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .card{padding:var(--space-5)}
  .totals{grid-template-columns:1fr}
  .sumcount{grid-template-columns:repeat(2,1fr)}
  .nav .btn{flex:1}
  .steps button:not(.now){padding-right:6px}
  .steps button:not(.now) .t{display:none}
  .topnav button,.topnav a{padding:0 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.grow{flex:1;min-width:0}

.grid2>.fld,.grid3>.fld{display:flex;flex-direction:column}
.grid2>.fld>.jd-input,.grid3>.fld>.jd-input,.grid2>.fld>.seg,.grid3>.fld>.seg{margin-top:auto}
@media (max-width:640px){
  .top{position:static}
  .topnav a{display:none}
  .top .wrap{min-height:60px}
  .topnav button{padding:0 8px;font-size:13px}
  .row .btn{flex:1 1 100%}
}

@media (max-width:640px){.grid2.pair{grid-template-columns:1fr 1fr}}

.sr:focus{position:fixed;left:12px;top:12px;width:auto;height:auto;clip:auto;overflow:visible;background:var(--surface-0);color:var(--ink-900);padding:12px 16px;border-radius:8px;z-index:60;border:2px solid var(--red-500)}

h1,h2,h3,h4,.btn,.linkbtn,.brand b,.sect summary{word-spacing:.1em}

</style>

(function(){
"use strict";
/* ================= core ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const getP=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);

const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/,/g,""));return isNaN(n)?0:n};
const fmtN=v=>num(v)?num(v).toLocaleString("en-US"):"";
const today=()=>new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});

let toastT;

/* ---------- agent config (URL params, then saved on this device) ---------- */
const DEF_LENDER={name:"Alan Blood",nmls:"103895 | 1790749",email:"alanblood@summithomeloans.com",phone:"801-706-2802"};
function readCfg(){
  let q=new URLSearchParams(),q2=new URLSearchParams();
  try{q=new URLSearchParams(location.search);q2=new URLSearchParams(String(location.hash||"").replace(/^#\??/,""))}catch(e){}
  const g=k=>(q.get(k)||q2.get(k)||"").trim();
  const fromUrl={name:g("an"),brokerage:g("br"),phone:g("ph"),email:g("em"),site:g("wb"),lic:g("lc"),leads:g("le"),
    lname:g("ln"),lemail:g("lm"),lphone:g("lp"),lnmls:g("lk"),nofin:g("nl")==="1"};
  if(fromUrl.name||fromUrl.brokerage||fromUrl.email){store.set("apt:cfg",fromUrl);return fromUrl}
  return store.get("apt:cfg",null)||{name:"",brokerage:"",phone:"",email:"",site:"",lic:"",leads:"",lname:"",lemail:"",lphone:"",lnmls:"",nofin:false};

function onChange(el){
  const k=el.dataset.k,ak=el.dataset.arr;
  if(ak){const arr=getP(S,ak)||[];const i=arr.indexOf(el.value);if(el.checked&&i<0)arr.push(el.value);if(!el.checked&&i>=0)arr.splice(i,1);setP(S,ak,arr)}
  else if(k){const v=el.type==="checkbox"?el.checked:el.value;setP(S,k,v)}
  else return;
  save();
  if(el.hasAttribute("data-re"))rerender(el);
  if(el.dataset.live)live();
}

/* ----- gaps and review ----- */
function gaps(){
  const s=S.seller,g=[];
  if(!s.prop.addr.trim())g.push([0,"Add the property address"]);
  if(!s.prop.year)g.push([0,"Add the year built"]);
  if(!num(s.sqft.ag_fin)&&!num(s.sqft.bg_fin))g.push([1,"Add finished square footage"]);
  if(s.kitchens.some(k=>!k.status))g.push([2,"Choose an update status for each kitchen"]);
  if(s.baths.some(k=>!k.status))g.push([2,"Choose an update status for each bathroom"]);
  if(!s.roof.age)g.push([3,"Add the roof's estimated age"]);
  if(!s.hasDefects)g.push([4,"Say whether you know of any problems"]);
  if(s.rental.any==="yes"&&!s.rental.rows.length)g.push([0,"Add rent details for each unit"]);
  return g;
}

    <div class="nav">${i>0?`<button class="linkbtn" id="sBack">Back</button>`:`<span></span>`}${i<STEPS.length-1?`<button class="btn" id="sNext">${i===STEPS.length-2?"Review":"Continue"}</button>`:`<span></span>`}</div>

  const st=$("#v-seller .steps"),nw=st&&$("button.now",st);if(nw)st.scrollLeft=Math.max(0,nw.offsetLeft-st.clientWidth/2+nw.clientWidth/2);

function live(){

document.addEventListener("input",e=>{if(ui.view==="seller"&&e.target.dataset.k&&/seller\.sqft\./.test(e.target.dataset.k))live()});
document.addEventListener("click",e=>{
  if(ui.view!=="seller")return;

    if(ui.sStep===0&&!S.seller.prop.addr.trim()){const a=$("#"+idOf("seller.prop.addr"));if(a){a.classList.add("bad");a.focus()}$("#stepErr").textContent="Add the street address to continue, since the summary needs it.";return}
    ui.sStep=Math.min(STEPS.length-1,ui.sStep+1);renderSeller();window.scrollTo(0,0);const h=$("#v-seller h2");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}}
  if(t.id==="sBack"){ui.sStep=Math.max(0,ui.sStep-1);renderSeller();window.scrollTo(0,0)}
  const act=t.dataset.act;
  if(act==="add"||act==="rm"){
    const k=t.dataset.arr,arr=getP(S,k)||[];
    if(act==="rm")arr.splice(Number(t.dataset.i),1);
    else{
      const tpl={"seller.rental.rows":{unit:"",beds:"",baths:"",rent:"",status:"",util:""},
        "seller.kitchens":{name:"Kitchen "+(arr.length+1),status:"",when:"",upd:[],cond:"",note:""},

const TYPES=[["sfr","Single-family"],["town","Townhome"],["condo","Condo"],["multi","2 to 4 units"],["mfg","Manufactured home"]];
function cl(s){return String(s==null?"":s).replace(/[\u2018\u2019\u201B]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014\u2212]/g,"-").replace(/\u2026/g,"...").replace(/\u00A0/g," ").replace(/[^\x09\x0A\x0D\x20-\x7E\xA1-\xFF]/g,"")}
function buildDoc(o){
  const {jsPDF}=window.jspdf,land=!!o.land;
  const d=new jsPDF({unit:"pt",format:"letter",orientation:land?"landscape":"portrait",compress:true});
  const W=land?792:612,H=land?612:792,M=44,CW=W-2*M,TOP=72,BOT=H-66;
  const C={ink:[20,20,20],mid:[96,96,96],line:[222,222,222],red:[237,28,37],shade:[246,246,246],ok:[232,245,238],warn:[255,244,220]};
  let y=TOP,first=true;
  const setC=c=>d.setTextColor(c[0],c[1],c[2]);
  function head(){
    d.setFillColor(C.red[0],C.red[1],C.red[2]);d.rect(M,28,24,4,"F");
    d.setFont("helvetica","bold");d.setFontSize(9);setC(C.ink);d.text(cl(o.headL),M,46);
    d.setFont("helvetica","normal");setC(C.mid);d.text(cl(o.headR||""),W-M,46,{align:"right"});
    d.setDrawColor(C.line[0],C.line[1],C.line[2]);d.setLineWidth(.6);d.line(M,54,W-M,54);
  }
  function page(){if(!first)d.addPage();first=false;head();y=TOP}
  function ensure(h){if(y+h>BOT)page()}
  function lines(t,w,size,bold){d.setFont("helvetica",bold?"bold":"normal");d.setFontSize(size);return d.splitTextToSize(cl(t),w)}
  page();
  const api={
    h1(t,sub){ensure(64);d.setFont("helvetica","bold");d.setFontSize(22);setC(C.ink);const ls=d.splitTextToSize(cl(t),CW);d.text(ls,M,y+18);y+=ls.length*26+2;
      if(sub){d.setFont("helvetica","normal");d.setFontSize(10.5);setC(C.mid);const s=d.splitTextToSize(cl(sub),CW);d.text(s,M,y+10);y+=s.length*14+6}y+=8},
    h2(t){ensure(110);y+=14;d.setFont("helvetica","bold");d.setFontSize(13);setC(C.ink);d.text(cl(t),M,y);y+=7;d.setDrawColor(C.red[0],C.red[1],C.red[2]);d.setLineWidth(1.6);d.line(M,y,M+26,y);y+=14},
    p(t,op){op=op||{};const size=op.size||9.5,lh=size*1.45;const ls=lines(t,CW,size,op.bold);
      for(const l of ls){ensure(lh);d.setFont("helvetica",op.bold?"bold":"normal");d.setFontSize(size);setC(op.color||C.mid);d.text(l,M,y+size);y+=lh}y+=(op.gap==null?5:op.gap)},
    kv(pairs,cols){cols=cols||2;const gap=16,cw=(CW-gap*(cols-1))/cols;
      for(let i=0;i<pairs.length;i+=cols){const row=pairs.slice(i,i+cols);
        const cells=row.map(pr=>({l:cl(pr[0]),v:lines(pr[1]===""||pr[1]==null?"-":pr[1],cw,9.5,true)}));
        const hh=Math.max.apply(null,cells.map(c=>c.v.length))*13+16;ensure(hh);
        cells.forEach((c,j)=>{const x=M+j*(cw+gap);d.setFont("helvetica","normal");d.setFontSize(7.5);setC(C.mid);d.text(c.l,x,y+8);d.setFont("helvetica","bold");d.setFontSize(9.5);setC(C.ink);d.text(c.v,x,y+21)});
        y+=hh}
      y+=4},
    table(cols,rows,op){op=op||{};const pad=5,fs=8.5,lh=11.5,ws=cols.map(c=>c.w*CW);
      const hdr=()=>{const hl=cols.map((c,i)=>lines(c.h,ws[i]-pad*2,8,true));const hh=Math.max.apply(null,hl.map(a=>a.length))*10+10;ensure(hh+14);d.setFillColor(C.shade[0],C.shade[1],C.shade[2]);d.rect(M,y,CW,hh,"F");d.setFont("helvetica","bold");d.setFontSize(8);setC(C.mid);let x=M;hl.forEach((a,i)=>{d.text(a,x+pad,y+12);x+=ws[i]});y+=hh};
      ensure(64);hdr();
      rows.forEach(r=>{
        const cells=r.map((t,i)=>lines(t===""||t==null?"-":t,ws[i]-pad*2,fs,i===0));
        const h=Math.max.apply(null,cells.map(c=>c.length))*lh+pad*2;
        if(y+h>BOT){page();hdr()}
        let x=M;cells.forEach((c,i)=>{d.setFont("helvetica",i===0?"bold":"normal");d.setFontSize(fs);setC(C.ink);d.text(c,x+pad,y+pad+fs);x+=ws[i]});
        y+=h;d.setDrawColor(C.line[0],C.line[1],C.line[2]);d.setLineWidth(.5);d.line(M,y,M+CW,y)
      });y+=10},
    checks(items){items.forEach(it=>{const ls=lines(it.t,CW-22,9.5,false);const h=Math.max(17,ls.length*13+5);ensure(h);
      d.setDrawColor(C.ink[0],C.ink[1],C.ink[2]);d.setLineWidth(.8);d.rect(M,y+1,9,9);
      if(it.on){d.setLineWidth(1.4);d.line(M+2,y+5.5,M+4,y+8.2);d.line(M+4,y+8.2,M+7.6,y+3)}

function pdfPrep(){

let DL=null;
(async()=>{try{if(window.claude&&typeof window.claude.use==="function")DL=await window.claude.use("downloads")}catch(e){DL=null}})();
function canShareFiles(){try{if(!navigator.canShare||!navigator.share||typeof File==="undefined")return false;return navigator.canShare({files:[new File([new Blob(["x"])],"a.pdf",{type:"application/pdf"})]})}catch(e){return false}}
function busy(b,on){if(!b)return;b.classList.toggle("busy",!!on);b.disabled=!!on}
const slug=s=>(String(s||"home").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"home").slice(0,40);
async function deliver(name,make,btn){
  busy(btn,true);
  try{
    await new Promise(r=>setTimeout(r,30));
    const blob=make().output("blob");
    if(DL){try{await DL.save({filename:name,data:blob});toast("Saved "+name);return}catch(err){if(err&&err.code==="declined")return}}
    const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),6000);toast("Downloading "+name);
  }catch(err){toast("Couldn't create the PDF, so please try again.")}
  finally{busy(btn,false)}
}
async function sharePdf(name,make,btn){
  busy(btn,true);
  try{await new Promise(r=>setTimeout(r,30));const file=new File([make().output("blob")],name,{type:"application/pdf"});await navigator.share({files:[file],title:name})}
  catch(e){if(!e||e.name!=="AbortError")toast("Sharing isn't available here, so use Download instead.")}
  finally{busy(btn,false)}
}
function openMail(to,subject,body){
  const u="mailto:"+to+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
  const a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
}

}
function buyerText(h){
  const st=homeStats(h);
  return ["Walkthrough summary for "+homeLabel(h),"","Could hold up financing: "+(st.risk.map(r=>r.it.t).join(", ")||"none flagged"),"To watch: "+(st.watch.map(r=>r.it.t).join(", ")||"none"),"","Questions for the seller:"].concat(questions(h).map(x=>"- "+x)).join("\n");

function lenderMail(){
  const L=lender();if(!L||!L.email){toast("No lender email is set up");return}
  openMail(L.email,"Pre-qualification question","Hi "+(L.name||"")+",\n\nI would like to talk about pre-qualification.\n\nName:\nBest phone:\nBuying or selling first:\n"+(hasAgent()?"\nI am working with "+cfg.name+(cfg.brokerage?" at "+cfg.brokerage:"")+".":"")+"\n\nSent from the Appraisal Prep tool.");

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const id=t.id;
  if(ui.view==="seller"){
    const a=addrOf()||"home";
    if(id==="dlApp")deliver("Appraiser-Summary-"+slug(S.seller.prop.addr)+".pdf",pdfAppraiser,t);
    if(id==="dlPrep")deliver("Appraisal-Prep-Checklist-"+slug(S.seller.prop.addr)+".pdf",pdfPrep,t);
    if(id==="shApp")sharePdf("Appraiser-Summary-"+slug(S.seller.prop.addr)+".pdf",pdfAppraiser,t);
    if(id==="mailAgent")openMail(leadTo(),"Appraisal summary for "+a,sellerText()+"\n\nI will attach the PDF summary.\n\n"+[S.seller.meta.cname||S.seller.prop.owner,S.seller.meta.cphone,S.seller.meta.cemail].filter(Boolean).join("\n"));
    if(id==="copySum")copyText(sellerText(),"Summary copied");
    if(id==="mailLender")lenderMail();
    if(id==="clearSeller"){
      if(ui.confirm===1){S.seller=newSeller();store.del("apt:seller");ui.confirm=0;ui.sStep=0;toast("Answers cleared");renderSeller();window.scrollTo(0,0)}
      else{ui.confirm=1;renderSeller(true);setTimeout(()=>{if(ui.confirm===1){ui.confirm=0;if(ui.view==="seller"&&ui.sStep===STEPS.length-1)renderSeller(true)}},4000)}
    }
  }
  if(ui.view==="buyer"){
    const h=curHome();
    if(id==="dlBuyer"&&h)deliver("Walkthrough-"+slug(h.addr)+".pdf",()=>pdfBuyer(h),t);
    if(id==="mailBuyer"&&h)openMail(leadTo(),"Walkthrough summary for "+homeLabel(h),buyerText(h));
    if(id==="copyBuyer"&&h)copyText(buyerText(h),"Summary copied");
    if(id==="mailLenderB")lenderMail();
    if(id==="dlCmp")deliver("Home-Comparison.pdf",pdfCompare,t);
  }
});
