<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · Basecamp</title>
    <style>
      :root {
        --canvas: #f5f3ea;
        --card: #ffffff;
        --ink: #1b2431;
        --muted: #4a5666;
        --border: #e2e0d6;
        --brand: #2f649c;
        --brand-hover: #254473;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0d1824;
          --card: #16263a;
          --ink: #e9eff6;
          --muted: #9fb1c4;
          --border: #28384b;
          --brand: #4e8cc8;
          --brand-hover: #639ad4;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--canvas);
        color: var(--ink);
        font-family: Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 36px 28px 32px;
      }
      img { height: 52px; width: auto; margin-bottom: 26px; }
      h1 { margin: 0 0 8px; font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
      p { margin: 0 0 24px; font-size: 15px; line-height: 1.55; color: var(--muted); }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 0 22px;
        height: 46px;
        font: 600 15px/1 inherit;
        font-family: inherit;
        color: #fff;
        background: var(--brand);
        cursor: pointer;
      }
      button:hover { background: var(--brand-hover); }
      button:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
      .status { margin-top: 18px; font-size: 13px; color: var(--muted); min-height: 1.2em; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/loan-base-camp.svg" alt="Loan Base Camp" />
      <h1>You're offline</h1>
      <p>Basecamp needs an internet connection to load your workspace. Check your connection, then try again.</p>
      <button id="retry" type="button">Try again</button>
      <div class="status" id="status" role="status"></div>
    </main>
    <script>
      // (Not named "status" — that's a built-in window property and silently ignores updates.)
      var statusEl = document.getElementById('status');
      function retry() {
        statusEl.textContent = 'Checking…';
        // Reload only if we can actually reach the app; otherwise say so and stay put.
        fetch('/manifest.webmanifest', { cache: 'no-store' })
          .then(function () { location.reload(); })
          .catch(function () { statusEl.textContent = 'Still offline. We’ll reconnect automatically.'; });
      }
      document.getElementById('retry').addEventListener('click', retry);
      // Come back on its own as soon as the connection returns.
      window.addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
