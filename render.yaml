# Render.com Blueprint — deploys LoanDr. as ONE free web service
# (Express API + the built React frontend served from the same origin).
#
# To use: push this repo to GitHub, then on render.com choose
# "New +" → "Blueprint" → pick this repo. Render reads this file and provisions
# the service automatically. See DEPLOYMENT.md for the click-by-click guide.

services:
  - type: web
    name: loandr
    runtime: node
    plan: starter
    # Build the frontend (dist/) and install the API's dependencies.
    buildCommand: npm install && npm --prefix server install && npm run build
    # Start the API, which also serves dist/ in production.
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Signing secret for login tokens — Render generates a strong random value.
      - key: JWT_SECRET
        generateValue: true

      # ---- Admin account -------------------------------------------------
      # Render prompts you for these on first deploy (sync:false = not stored in
      # this file). Pick a strong ADMIN_PASSWORD; ADMIN_EMAIL is optional.
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false

      # ---- Your personal loan-officer login ------------------------------
      # Seeded on first run so you can always sign in, even with signups closed.
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: OWNER_COMPANY
        sync: false

      # ---- Access control ------------------------------------------------
      # Public self-signup is OFF. To invite people without opening signups to
      # everyone, set a PRIVATE SIGNUP_CODE in Render → Environment (they enter it
      # on the Create-account screen); leave it unset to fully close signups. Your
      # own owner login never needs the code. Do NOT commit a real code here — a
      # guessable value committed to the repo effectively opens registration.
      - key: ALLOW_SIGNUP
        value: "false"
      - key: SIGNUP_CODE
        sync: false
      # No demo/sample accounts in production.
      - key: SEED_DEMO_USER
        value: "false"

      # ---- Public URL (for the Zapier/LOS webhook link shown in the app) -
      # Set to your Render URL after first deploy, e.g. https://loandr.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false

      # ---- AI assistant (Compare tab) ------------------------------------
      # Set your Anthropic API key to turn on the "Ask AI" assistant on the
      # Compare page. Until it's set, the assistant shows "not turned on yet".
      # Costs a small amount per question. Optional ANTHROPIC_MODEL picks a
      # cheaper/faster model, e.g. claude-haiku-4-5 (default is claude-opus-5).
      - key: ANTHROPIC_API_KEY
        sync: false
      # - key: ANTHROPIC_MODEL
      #   value: claude-haiku-4-5

      # ---- County median-income tool -------------------------------------
      # Pulls real data from the U.S. Census Bureau; works with no key. Set a
      # (free) CENSUS_API_KEY to raise rate limits, or CENSUS_YEAR to pin the
      # ACS 5-year vintage (default 2023).
      # - key: CENSUS_API_KEY
      #   sync: false

      # ---- Persistent storage --------------------------------------------
      # Data lives on the mounted disk below, so accounts, webhook tokens, saved
      # scenarios, and received loans survive restarts and redeploys.
      - key: DATA_DIR
        value: /var/data

    # Persistent disk (paid plans). Its mount path matches DATA_DIR above.
    disk:
      name: loandr-data
      mountPath: /var/data
      sizeGB: 1
