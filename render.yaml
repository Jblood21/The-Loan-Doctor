# Render.com Blueprint — deploys LoanDr. as ONE free web service
# (Express API + the built React frontend served from the same origin).
#
# To use: push this repo to GitHub, then on render.com choose
# "New +" → "Blueprint" → pick this repo. Render reads this file and provisions
# the service automatically. See DEPLOYMENT.md for the click-by-click guide.

services:
  - type: web
    name: loandr
    runtime: node
    plan: free
    # Build the frontend (dist/) and install the API's dependencies.
    buildCommand: npm install && npm --prefix server install && npm run build
    # Start the API, which also serves dist/ in production.
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Signing secret for login tokens — Render generates a strong random value.
      - key: JWT_SECRET
        generateValue: true

      # ---- Admin account -------------------------------------------------
      # Render prompts you for these on first deploy (sync:false = not stored in
      # this file). Pick a strong ADMIN_PASSWORD; ADMIN_EMAIL is optional.
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false

      # ---- Your personal loan-officer login ------------------------------
      # Seeded on first run so you can always sign in, even with signups closed.
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: OWNER_COMPANY
        sync: false

      # ---- Access control ------------------------------------------------
      # Public self-signup is OFF. To let specific people register, set a
      # SIGNUP_CODE and share it; they enter it on the Create-account screen.
      - key: ALLOW_SIGNUP
        value: "false"
      - key: SIGNUP_CODE
        sync: false
      # No demo/sample accounts in production.
      - key: SEED_DEMO_USER
        value: "false"

      # ---- Public URL (for the Zapier/LOS webhook link shown in the app) -
      # Set to your Render URL after first deploy, e.g. https://loandr.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
